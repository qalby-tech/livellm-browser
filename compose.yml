services:
  redis:
    image: redis:7-alpine
    container_name: livellm-redis
    ports:
      - "6379:6379"
    restart: unless-stopped

  livellm-browser:
    build:
      context: ./browser
      dockerfile: Dockerfile
    image: kamasalyamov/livellm-browser:2.0.1
    container_name: livellm-browser-2.0.1
    ports:
      # VNC port
      - "5901:5901"
      # noVNC web interface
      - "6901:6901"
      # FastAPI Launcher
      - "9000:9000"
    environment:
      - VNC_PW=headless
      - VNC_RESOLUTION=1920x1080
      - DISPLAY=:1
      - REDIS_URL=redis://redis:6379/0
      - BROWSER_ADDRESS=livellm-browser
      - NODE_OPTIONS=--max-old-space-size=6144
    volumes:
      # Mount profiles directory from host with read/write access
      - profiles_volume:/home/headless/Desktop/app/profiles:rw
    depends_on:
      - redis
    restart: unless-stopped
    stop_grace_period: 10s
    shm_size: '4gb'
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: '8gb'
        reservations:
          cpus: '1'
          memory: '4gb'

  livellm-controller:
    build:
      context: ./controller
      dockerfile: Dockerfile
    image: kamasalyamov/livellm-controller:2.0.1
    container_name: livellm-controller-2.0.1
    ports:
      # FastAPI Controller
      - "8000:8000"
    environment:
      - REDIS_URL=redis://redis:6379/0
      - NODE_OPTIONS=--max-old-space-size=3072
    depends_on:
      - redis
      - livellm-browser
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: '4gb'

volumes:
  profiles_volume:
    driver: local