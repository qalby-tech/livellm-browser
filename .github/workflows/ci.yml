name: CI/CD Pipeline

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

env:
  REGISTRY: docker.io
  IMAGE_NAME: kamasalyamov/livellm-browser
  CHART_REPO: qalby-tech/livellm-browser-operator-chart

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Install dependencies
        working-directory: controller
        run: uv sync --all-extras

      - name: Run tests
        working-directory: controller
        run: uv run pytest tests/ -v --tb=short

      - name: Install browser dependencies
        working-directory: browser
        run: uv sync --all-extras

      - name: Run browser tests
        working-directory: browser
        run: uv run pytest tests/ -v --tb=short

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: browser/keeper/go.mod
          cache-dependency-path: browser/keeper/go.sum

      - name: Run keeper tests
        working-directory: browser/keeper
        run: go vet ./... && go test -count=1 ./...

      # ── The Camoufox engine (Python 3.12, stock Playwright) ──

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run Camoufox launcher tests
        working-directory: camoufox
        run: uv sync --frozen && uv run --frozen pytest tests/ -v --tb=short

      - name: Run controller tests (Camoufox engine)
        working-directory: controller
        env:
          BROWSER_ENGINE: camoufox
        run: |
          python3.12 -m venv "$RUNNER_TEMP/cfctl"
          "$RUNNER_TEMP/cfctl/bin/pip" install --require-hashes --no-deps -r requirements-camoufox.txt
          "$RUNNER_TEMP/cfctl/bin/pip" install "pytest>=8.0.0" "pytest-asyncio>=0.23.0"
          "$RUNNER_TEMP/cfctl/bin/python" -m pytest tests/ -v --tb=short

      - name: Camoufox release rules (one Playwright pin; controller vs camoufox version)
        run: |
          base="${{ github.event.before }}"
          if [ "${{ github.event_name }}" = "pull_request" ]; then base="${{ github.event.pull_request.base.sha }}"; fi
          bash .github/scripts/check-camoufox-pins.sh "$base"

      - name: CI script tests
        run: bash .github/scripts/test-ci-scripts.sh

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extract versions from pyproject.toml
        id: version
        run: |
          BROWSER_VERSION=$(grep '^version = ' browser/pyproject.toml | sed 's/version = "\(.*\)"/\1/')
          CONTROLLER_VERSION=$(grep '^version = ' controller/pyproject.toml | sed 's/version = "\(.*\)"/\1/')
          CAMOUFOX_VERSION=$(grep '^version = ' camoufox/pyproject.toml | sed 's/version = "\(.*\)"/\1/')
          echo "BROWSER_VERSION=$BROWSER_VERSION" >> $GITHUB_OUTPUT
          echo "CONTROLLER_VERSION=$CONTROLLER_VERSION" >> $GITHUB_OUTPUT
          echo "CAMOUFOX_VERSION=$CAMOUFOX_VERSION" >> $GITHUB_OUTPUT
          echo "Browser: $BROWSER_VERSION, Controller: $CONTROLLER_VERSION, Camoufox: $CAMOUFOX_VERSION"

      - name: Compute image tags
        id: tags
        run: |
          BROWSER_VERSION="${{ steps.version.outputs.BROWSER_VERSION }}"
          CONTROLLER_VERSION="${{ steps.version.outputs.CONTROLLER_VERSION }}"
          CAMOUFOX_VERSION="${{ steps.version.outputs.CAMOUFOX_VERSION }}"
          IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}"
          if [ "${{ github.ref }}" = "refs/heads/develop" ]; then
            echo "BROWSER_TAG=${IMAGE}:dev-${BROWSER_VERSION}" >> $GITHUB_OUTPUT
            echo "CONTROLLER_TAG=${IMAGE}:dev-controller-${CONTROLLER_VERSION}" >> $GITHUB_OUTPUT
            echo "CAMOUFOX_TAG=${IMAGE}:dev-camoufox-${CAMOUFOX_VERSION}" >> $GITHUB_OUTPUT
            echo "CAMOUFOX_API_TAG=${IMAGE}:dev-camoufox-api-${CAMOUFOX_VERSION}" >> $GITHUB_OUTPUT
          else
            echo "BROWSER_TAG=${IMAGE}:${BROWSER_VERSION}" >> $GITHUB_OUTPUT
            echo "CONTROLLER_TAG=${IMAGE}:controller-${CONTROLLER_VERSION}" >> $GITHUB_OUTPUT
            echo "CAMOUFOX_TAG=${IMAGE}:camoufox-${CAMOUFOX_VERSION}" >> $GITHUB_OUTPUT
            echo "CAMOUFOX_API_TAG=${IMAGE}:camoufox-api-${CAMOUFOX_VERSION}" >> $GITHUB_OUTPUT
          fi

      # Tags are immutable (.github/scripts/tag-guard.sh): an existing tag is
      # never rebuilt, and an unclear registry answer fails the job.
      - name: Tag guard (browser)
        id: guard-browser
        run: bash .github/scripts/tag-guard.sh "${{ steps.tags.outputs.BROWSER_TAG }}" >> $GITHUB_OUTPUT

      - name: Tag guard (controller)
        id: guard-controller
        run: bash .github/scripts/tag-guard.sh "${{ steps.tags.outputs.CONTROLLER_TAG }}" >> $GITHUB_OUTPUT

      - name: Tag guard (camoufox)
        id: guard-camoufox
        run: bash .github/scripts/tag-guard.sh "${{ steps.tags.outputs.CAMOUFOX_TAG }}" >> $GITHUB_OUTPUT

      - name: Tag guard (camoufox Browser API)
        id: guard-camoufox-api
        run: bash .github/scripts/tag-guard.sh "${{ steps.tags.outputs.CAMOUFOX_API_TAG }}" >> $GITHUB_OUTPUT

      - name: Build and push browser image
        if: steps.guard-browser.outputs.build == 'true'
        uses: docker/build-push-action@v5
        with:
          context: ./browser
          file: ./browser/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.tags.outputs.BROWSER_TAG }}
          cache-from: type=gha,scope=browser
          cache-to: type=gha,mode=max,scope=browser

      - name: Build and push controller image
        if: steps.guard-controller.outputs.build == 'true'
        uses: docker/build-push-action@v5
        with:
          context: ./controller
          file: ./controller/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.tags.outputs.CONTROLLER_TAG }}
          cache-from: type=gha,scope=controller
          cache-to: type=gha,mode=max,scope=controller

      # The Camoufox image carries a 1.3 GB browser download; the runner's
      # preinstalled SDKs make room for it.
      - name: Free runner disk (camoufox)
        if: steps.guard-camoufox.outputs.build == 'true'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Build and push camoufox image
        if: steps.guard-camoufox.outputs.build == 'true'
        uses: docker/build-push-action@v5
        with:
          # Context is the repo root (it needs browser/keeper and
          # browser/startup.sh); camoufox/Dockerfile.dockerignore keeps it to
          # exactly those and camoufox/.
          context: .
          file: ./camoufox/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.tags.outputs.CAMOUFOX_TAG }}

      - name: Build and push camoufox Browser API image
        if: steps.guard-camoufox-api.outputs.build == 'true'
        uses: docker/build-push-action@v5
        with:
          context: ./controller
          file: ./controller/Dockerfile.camoufox
          platforms: linux/amd64
          push: true
          tags: ${{ steps.tags.outputs.CAMOUFOX_API_TAG }}
          cache-from: type=gha,scope=camoufox-api
          cache-to: type=gha,mode=max,scope=camoufox-api

  update-chart:
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
    permissions:
      contents: write
    steps:
      - name: Checkout current repository code
        uses: actions/checkout@v4

      - name: Extract versions from pyproject.toml
        id: version
        run: |
          BROWSER_VERSION=$(grep '^version = ' browser/pyproject.toml | sed 's/version = "\(.*\)"/\1/')
          CONTROLLER_VERSION=$(grep '^version = ' controller/pyproject.toml | sed 's/version = "\(.*\)"/\1/')
          CAMOUFOX_VERSION=$(grep '^version = ' camoufox/pyproject.toml | sed 's/version = "\(.*\)"/\1/')
          echo "BROWSER_VERSION=$BROWSER_VERSION" >> $GITHUB_OUTPUT
          echo "CONTROLLER_VERSION=$CONTROLLER_VERSION" >> $GITHUB_OUTPUT
          echo "CAMOUFOX_VERSION=$CAMOUFOX_VERSION" >> $GITHUB_OUTPUT
          echo "Browser version: $BROWSER_VERSION, Controller version: $CONTROLLER_VERSION, Camoufox version: $CAMOUFOX_VERSION"

      - name: Determine chart branch
        id: chart-branch
        run: |
          if [ "${{ github.ref }}" = "refs/heads/develop" ]; then
            echo "BRANCH=develop" >> $GITHUB_OUTPUT
          else
            echo "BRANCH=main" >> $GITHUB_OUTPUT
          fi

      - name: Checkout chart repository
        uses: actions/checkout@v4
        with:
          repository: ${{ env.CHART_REPO }}
          token: ${{ secrets.CHART_REPO_TOKEN }}
          ref: ${{ steps.chart-branch.outputs.BRANCH }}
          path: chart-repo

      # Only the lines whose value changed are written; a missing annotation
      # is inserted; nothing is committed when all four are unchanged
      # (.github/scripts/update_chart.py).
      - name: Update Chart.yaml
        id: update-chart
        run: |
          BROWSER_VERSION="${{ steps.version.outputs.BROWSER_VERSION }}"
          CONTROLLER_VERSION="${{ steps.version.outputs.CONTROLLER_VERSION }}"
          CAMOUFOX_VERSION="${{ steps.version.outputs.CAMOUFOX_VERSION }}"
          if [ "${{ github.ref }}" = "refs/heads/develop" ]; then
            APP_VERSION="dev-${BROWSER_VERSION}"
            CTRL_VERSION="dev-controller-${CONTROLLER_VERSION}"
            CF_VERSION="dev-camoufox-${CAMOUFOX_VERSION}"
            CF_API_VERSION="dev-camoufox-api-${CAMOUFOX_VERSION}"
          else
            APP_VERSION="${BROWSER_VERSION}"
            CTRL_VERSION="controller-${CONTROLLER_VERSION}"
            CF_VERSION="camoufox-${CAMOUFOX_VERSION}"
            CF_API_VERSION="camoufox-api-${CAMOUFOX_VERSION}"
          fi
          python3 .github/scripts/update_chart.py chart-repo/Chart.yaml \
            --app "$APP_VERSION" --controller "$CTRL_VERSION" \
            --camoufox "$CF_VERSION" --camoufox-api "$CF_API_VERSION" >> $GITHUB_OUTPUT
          echo "Chart.yaml now:"
          cat chart-repo/Chart.yaml

      - name: Commit and push changes
        if: steps.update-chart.outputs.changed == 'true'
        working-directory: chart-repo
        run: |
          git config user.name "github-actions"
          git config user.email "kamasalyamov@gmail.com"
          git add Chart.yaml
          git commit -m "chore(chart): update browser ${{ steps.version.outputs.BROWSER_VERSION }}, controller ${{ steps.version.outputs.CONTROLLER_VERSION }}, camoufox ${{ steps.version.outputs.CAMOUFOX_VERSION }}"
          git push origin ${{ steps.chart-branch.outputs.BRANCH }}
