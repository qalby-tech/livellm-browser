[project]
name = "livellm-agent"
version = "0.1.0"
description = "Browser-agent runtime: drives a Browser over CDP as a reviewable trajectory of steps (browser-use + patchright)"
readme = "README.md"
# browser-use requires Python >= 3.11 — cannot share the 3.9 controller base.
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.121.3",
    "uvicorn>=0.38.0",
    "pydantic>=2.12.4",
    "pydantic-settings>=2.0",
    "httpx>=0.27",
    "websockets>=13.0",
    "browser-use>=0.3,<0.5",
    "patchright==1.56.0",
    "boto3>=1.34",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
