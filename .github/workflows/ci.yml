name: CI/CD Pipeline

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

env:
  REGISTRY: docker.io
  IMAGE_NAME: kamasalyamov/livellm-browser
  CHART_REPO: qalby-tech/livellm-browser-operator-chart

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      
      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"
      
      - name: Install dependencies
        working-directory: controller
        run: uv sync --all-extras
            
      - name: Run tests
        working-directory: controller
        run: uv run pytest tests/ -v --tb=short

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
    permissions:
      contents: read
      packages: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      
      - name: Extract versions from pyproject.toml
        id: version
        run: |
          BROWSER_VERSION=$(grep '^version = ' browser/pyproject.toml | sed 's/version = "\(.*\)"/\1/')
          CONTROLLER_VERSION=$(grep '^version = ' controller/pyproject.toml | sed 's/version = "\(.*\)"/\1/')
          echo "BROWSER_VERSION=$BROWSER_VERSION" >> $GITHUB_OUTPUT
          echo "CONTROLLER_VERSION=$CONTROLLER_VERSION" >> $GITHUB_OUTPUT
          echo "Browser version: $BROWSER_VERSION, Controller version: $CONTROLLER_VERSION"

      - name: Compute image tags
        id: tags
        run: |
          BROWSER_VERSION="${{ steps.version.outputs.BROWSER_VERSION }}"
          CONTROLLER_VERSION="${{ steps.version.outputs.CONTROLLER_VERSION }}"
          IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}"
          if [ "${{ github.ref }}" = "refs/heads/develop" ]; then
            echo "BROWSER_TAG=${IMAGE}:dev-${BROWSER_VERSION}" >> $GITHUB_OUTPUT
            echo "CONTROLLER_TAG=${IMAGE}:dev-controller-${CONTROLLER_VERSION}" >> $GITHUB_OUTPUT
          else
            echo "BROWSER_TAG=${IMAGE}:${BROWSER_VERSION}" >> $GITHUB_OUTPUT
            echo "CONTROLLER_TAG=${IMAGE}:controller-${CONTROLLER_VERSION}" >> $GITHUB_OUTPUT
          fi

      - name: Build and push browser image
        uses: docker/build-push-action@v5
        with:
          context: ./browser
          file: ./browser/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.tags.outputs.BROWSER_TAG }}
          cache-from: type=gha,scope=browser
          cache-to: type=gha,mode=max,scope=browser

      - name: Build and push controller image
        uses: docker/build-push-action@v5
        with:
          context: ./controller
          file: ./controller/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.tags.outputs.CONTROLLER_TAG }}
          cache-from: type=gha,scope=controller
          cache-to: type=gha,mode=max,scope=controller
  
  update-chart:
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
    permissions:
      contents: write
    steps:
      - name: Checkout current repository code
        uses: actions/checkout@v4
            
      - name: Extract versions from pyproject.toml
        id: version
        run: |
          BROWSER_VERSION=$(grep '^version = ' browser/pyproject.toml | sed 's/version = "\(.*\)"/\1/')
          CONTROLLER_VERSION=$(grep '^version = ' controller/pyproject.toml | sed 's/version = "\(.*\)"/\1/')
          echo "BROWSER_VERSION=$BROWSER_VERSION" >> $GITHUB_OUTPUT
          echo "CONTROLLER_VERSION=$CONTROLLER_VERSION" >> $GITHUB_OUTPUT
          echo "Browser version: $BROWSER_VERSION, Controller version: $CONTROLLER_VERSION"

      - name: Determine chart branch
        id: chart-branch
        run: |
          if [ "${{ github.ref }}" = "refs/heads/develop" ]; then
            echo "BRANCH=develop" >> $GITHUB_OUTPUT
          else
            echo "BRANCH=main" >> $GITHUB_OUTPUT
          fi
      
      - name: Checkout chart repository
        uses: actions/checkout@v4
        with:
          repository: ${{ env.CHART_REPO }}
          token: ${{ secrets.CHART_REPO_TOKEN }}
          ref: ${{ steps.chart-branch.outputs.BRANCH }}
          path: chart-repo

      - name: Update Chart.yaml
        id: update-chart
        working-directory: chart-repo
        run: |
          BROWSER_VERSION="${{ steps.version.outputs.BROWSER_VERSION }}"
          CONTROLLER_VERSION="${{ steps.version.outputs.CONTROLLER_VERSION }}"
          
          # Compute appVersion and controllerVersion based on branch
          if [ "${{ github.ref }}" = "refs/heads/develop" ]; then
            APP_VERSION="dev-${BROWSER_VERSION}"
            CTRL_VERSION="dev-controller-${CONTROLLER_VERSION}"
          else
            APP_VERSION="${BROWSER_VERSION}"
            CTRL_VERSION="controller-${CONTROLLER_VERSION}"
          fi
          
          CURRENT_APP_VERSION=$(grep '^appVersion:' Chart.yaml | sed 's/appVersion: "\(.*\)"/\1/')
          CURRENT_CTRL_VERSION=$(grep 'controllerVersion:' Chart.yaml | sed 's/.*controllerVersion: "\(.*\)"/\1/')
          
          if [ "$APP_VERSION" == "$CURRENT_APP_VERSION" ] && [ "$CTRL_VERSION" == "$CURRENT_CTRL_VERSION" ]; then
            echo "Versions unchanged. Skipping chart update."
            echo "skip=true" >> $GITHUB_OUTPUT
            exit 0
          fi
          
          sed -i "s/appVersion:.*/appVersion: \"$APP_VERSION\"/" Chart.yaml
          sed -i "s/.*controllerVersion:.*/  controllerVersion: \"$CTRL_VERSION\"/" Chart.yaml
          
          echo "Updated Chart.yaml:"
          cat Chart.yaml
          echo "updated_app_version=$APP_VERSION" >> $GITHUB_OUTPUT
          echo "updated_ctrl_version=$CTRL_VERSION" >> $GITHUB_OUTPUT
      
      - name: Commit and push changes
        if: steps.update-chart.outputs.skip != 'true'
        working-directory: chart-repo
        run: |
          git config user.name "github-actions"
          git config user.email "kamasalyamov@gmail.com"
          git add Chart.yaml
          git commit -m "chore(chart): update browser ${{ steps.version.outputs.BROWSER_VERSION }}, controller ${{ steps.version.outputs.CONTROLLER_VERSION }}"
          git push origin ${{ steps.chart-branch.outputs.BRANCH }}
