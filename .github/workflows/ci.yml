name: CI/CD Pipeline

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

env:
  REGISTRY: docker.io
  IMAGE_NAME: kamasalyamov/livellm-browser
  CHART_REPO: qalby-tech/livellm-browser-operator-chart

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      # ── The Browser API (Python 3.12, both clients) ──

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run controller tests
        working-directory: controller
        run: uv sync --frozen && uv run --frozen pytest tests/ -v --tb=short

      - name: Run Camoufox launcher tests
        working-directory: browser/camoufox
        run: uv sync --frozen && uv run --frozen pytest tests/ -v --tb=short

      # ── The Chrome browser (Python 3.9) ──

      - name: Set up Python 3.9
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Install Chrome browser dependencies
        working-directory: browser/chrome
        run: uv sync --all-extras

      - name: Run Chrome browser tests
        working-directory: browser/chrome
        run: uv run pytest tests/ -v --tb=short

      # ── The control sidecar (both browser images) ──

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: browser/keeper/go.mod
          cache-dependency-path: browser/keeper/go.sum

      - name: Run keeper tests
        working-directory: browser/keeper
        run: go vet ./... && go test -count=1 ./...

      - name: Release rules (one Playwright pin; one patchright pin)
        run: bash .github/scripts/check-pins.sh

      - name: CI script tests
        run: bash .github/scripts/test-ci-scripts.sh

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extract versions from pyproject.toml
        id: version
        run: |
          CHROME_VERSION=$(grep '^version = ' browser/chrome/pyproject.toml | sed 's/version = "\(.*\)"/\1/')
          CONTROLLER_VERSION=$(grep '^version = ' controller/pyproject.toml | sed 's/version = "\(.*\)"/\1/')
          CAMOUFOX_VERSION=$(grep '^version = ' browser/camoufox/pyproject.toml | sed 's/version = "\(.*\)"/\1/')
          echo "CHROME_VERSION=$CHROME_VERSION" >> $GITHUB_OUTPUT
          echo "CONTROLLER_VERSION=$CONTROLLER_VERSION" >> $GITHUB_OUTPUT
          echo "CAMOUFOX_VERSION=$CAMOUFOX_VERSION" >> $GITHUB_OUTPUT
          echo "Chrome: $CHROME_VERSION, Controller: $CONTROLLER_VERSION, Camoufox: $CAMOUFOX_VERSION"

      - name: Compute image tags
        id: tags
        run: |
          CHROME_VERSION="${{ steps.version.outputs.CHROME_VERSION }}"
          CONTROLLER_VERSION="${{ steps.version.outputs.CONTROLLER_VERSION }}"
          CAMOUFOX_VERSION="${{ steps.version.outputs.CAMOUFOX_VERSION }}"
          IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}"
          if [ "${{ github.ref }}" = "refs/heads/develop" ]; then
            echo "CHROME_TAG=${IMAGE}:dev-chrome-${CHROME_VERSION}" >> $GITHUB_OUTPUT
            echo "CONTROLLER_TAG=${IMAGE}:dev-controller-${CONTROLLER_VERSION}" >> $GITHUB_OUTPUT
            echo "CAMOUFOX_TAG=${IMAGE}:dev-camoufox-${CAMOUFOX_VERSION}" >> $GITHUB_OUTPUT
          else
            echo "CHROME_TAG=${IMAGE}:chrome-${CHROME_VERSION}" >> $GITHUB_OUTPUT
            echo "CONTROLLER_TAG=${IMAGE}:controller-${CONTROLLER_VERSION}" >> $GITHUB_OUTPUT
            echo "CAMOUFOX_TAG=${IMAGE}:camoufox-${CAMOUFOX_VERSION}" >> $GITHUB_OUTPUT
          fi

      # Tags are immutable (.github/scripts/tag-guard.sh): an existing tag is
      # never rebuilt, and an unclear registry answer fails the job.
      - name: Tag guard (chrome)
        id: guard-chrome
        run: bash .github/scripts/tag-guard.sh "${{ steps.tags.outputs.CHROME_TAG }}" >> $GITHUB_OUTPUT

      - name: Tag guard (controller)
        id: guard-controller
        run: bash .github/scripts/tag-guard.sh "${{ steps.tags.outputs.CONTROLLER_TAG }}" >> $GITHUB_OUTPUT

      - name: Tag guard (camoufox)
        id: guard-camoufox
        run: bash .github/scripts/tag-guard.sh "${{ steps.tags.outputs.CAMOUFOX_TAG }}" >> $GITHUB_OUTPUT

      # Both browser images build from the context browser/ (each copies
      # keeper/, desktop/ and its own directory; browser/.dockerignore).
      - name: Build and push chrome image
        if: steps.guard-chrome.outputs.build == 'true'
        uses: docker/build-push-action@v5
        with:
          context: ./browser
          file: ./browser/chrome/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.tags.outputs.CHROME_TAG }}
          cache-from: type=gha,scope=chrome
          cache-to: type=gha,mode=max,scope=chrome

      - name: Build and push controller image
        if: steps.guard-controller.outputs.build == 'true'
        uses: docker/build-push-action@v5
        with:
          context: ./controller
          file: ./controller/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.tags.outputs.CONTROLLER_TAG }}
          cache-from: type=gha,scope=controller
          cache-to: type=gha,mode=max,scope=controller

      # The Camoufox image carries a 1.3 GB browser download; the runner's
      # preinstalled SDKs make room for it.
      - name: Free runner disk (camoufox)
        if: steps.guard-camoufox.outputs.build == 'true'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Build and push camoufox image
        if: steps.guard-camoufox.outputs.build == 'true'
        uses: docker/build-push-action@v5
        with:
          context: ./browser
          file: ./browser/camoufox/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.tags.outputs.CAMOUFOX_TAG }}

  update-chart:
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
    permissions:
      contents: write
    steps:
      - name: Checkout current repository code
        uses: actions/checkout@v4

      - name: Extract versions from pyproject.toml
        id: version
        run: |
          CHROME_VERSION=$(grep '^version = ' browser/chrome/pyproject.toml | sed 's/version = "\(.*\)"/\1/')
          CONTROLLER_VERSION=$(grep '^version = ' controller/pyproject.toml | sed 's/version = "\(.*\)"/\1/')
          CAMOUFOX_VERSION=$(grep '^version = ' browser/camoufox/pyproject.toml | sed 's/version = "\(.*\)"/\1/')
          echo "CHROME_VERSION=$CHROME_VERSION" >> $GITHUB_OUTPUT
          echo "CONTROLLER_VERSION=$CONTROLLER_VERSION" >> $GITHUB_OUTPUT
          echo "CAMOUFOX_VERSION=$CAMOUFOX_VERSION" >> $GITHUB_OUTPUT
          echo "Chrome version: $CHROME_VERSION, Controller version: $CONTROLLER_VERSION, Camoufox version: $CAMOUFOX_VERSION"

      - name: Determine chart branch
        id: chart-branch
        run: |
          if [ "${{ github.ref }}" = "refs/heads/develop" ]; then
            echo "BRANCH=develop" >> $GITHUB_OUTPUT
          else
            echo "BRANCH=main" >> $GITHUB_OUTPUT
          fi

      - name: Checkout chart repository
        uses: actions/checkout@v4
        with:
          repository: ${{ env.CHART_REPO }}
          token: ${{ secrets.CHART_REPO_TOKEN }}
          ref: ${{ steps.chart-branch.outputs.BRANCH }}
          path: chart-repo

      # Only the lines whose value changed are written; a missing annotation
      # is inserted; nothing is committed when all three are unchanged
      # (.github/scripts/update_chart.py).
      - name: Update Chart.yaml
        id: update-chart
        run: |
          CHROME_VERSION="${{ steps.version.outputs.CHROME_VERSION }}"
          CONTROLLER_VERSION="${{ steps.version.outputs.CONTROLLER_VERSION }}"
          CAMOUFOX_VERSION="${{ steps.version.outputs.CAMOUFOX_VERSION }}"
          if [ "${{ github.ref }}" = "refs/heads/develop" ]; then
            APP_VERSION="dev-chrome-${CHROME_VERSION}"
            CTRL_VERSION="dev-controller-${CONTROLLER_VERSION}"
            CF_VERSION="dev-camoufox-${CAMOUFOX_VERSION}"
          else
            APP_VERSION="chrome-${CHROME_VERSION}"
            CTRL_VERSION="controller-${CONTROLLER_VERSION}"
            CF_VERSION="camoufox-${CAMOUFOX_VERSION}"
          fi
          python3 .github/scripts/update_chart.py chart-repo/Chart.yaml \
            --app "$APP_VERSION" --controller "$CTRL_VERSION" \
            --camoufox "$CF_VERSION" >> $GITHUB_OUTPUT
          echo "Chart.yaml now:"
          cat chart-repo/Chart.yaml

      - name: Commit and push changes
        if: steps.update-chart.outputs.changed == 'true'
        working-directory: chart-repo
        run: |
          git config user.name "github-actions"
          git config user.email "kamasalyamov@gmail.com"
          git add Chart.yaml
          git commit -m "chore(chart): update chrome ${{ steps.version.outputs.CHROME_VERSION }}, controller ${{ steps.version.outputs.CONTROLLER_VERSION }}, camoufox ${{ steps.version.outputs.CAMOUFOX_VERSION }}"
          git push origin ${{ steps.chart-branch.outputs.BRANCH }}
