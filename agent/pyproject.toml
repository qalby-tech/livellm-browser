[project]
name = "livellm-agent"
version = "0.1.14"
description = "Browser-agent runtime: drives a Browser over CDP as a reviewable trajectory of steps (browser-use + patchright)"
readme = "README.md"
# browser-use requires Python >= 3.11 — cannot share the 3.9 controller base.
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.121.3",
    "uvicorn>=0.38.0",
    "pydantic>=2.12.4",
    "pydantic-settings>=2.0",
    "httpx>=0.27",
    "websockets>=13.0",
    # Pinned: 0.12.x talks raw CDP via cdp-use (dropped Playwright/Patchright),
    # uses its own Chat* LLM classes, and Tools() registry. The engine codes to
    # this exact surface — do not float the major/minor without re-checking.
    "browser-use==0.12.9",
    # Provider SDKs (also pulled transitively by browser-use) — pinned for the
    # planner pass, which calls the provider directly for a structured plan.
    "anthropic>=0.40",
    "openai>=1.50",
    "boto3>=1.34",
    # browser-use's optional [video] extra — its RecordingWatchdog encodes the
    # run recording (CDP screencast → VideoRecorderService → MP4) via imageio,
    # which pulls a bundled ffmpeg binary through imageio-ffmpeg.
    "imageio>=2.37.3",
    "imageio-ffmpeg>=0.6.0",
    "numpy>=2.4.6",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
