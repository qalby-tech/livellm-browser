services:
  livellm-browser:
    build:
      # Both browser images build from browser/ (keeper/ and desktop/ are shared).
      context: ./browser
      dockerfile: chrome/Dockerfile
    image: kamasalyamov/livellm-browser:chrome-2.4.0
    container_name: livellm-browser
    ports:
      # VNC port
      - "5901:5901"
      # noVNC web interface
      - "6901:6901"
      # FastAPI Launcher
      - "9000:9000"
      # CDP proxy — fixed port so the controller's ws_url is deterministic
      - "9222:9222"
    environment:
      - VNC_PW=headless
      - VNC_RESOLUTION=1920x1080
      - DISPLAY=:1
      # Pin the primary browser's CDP proxy to a fixed port. In K8s the
      # operator's Service targets this; in compose the controller's
      # registry file points at it.
      - CDP_PORT=9222
      - NODE_OPTIONS=--max-old-space-size=6144
    volumes:
      # Mount profiles directory from host with read/write access
      - profiles_volume:/home/headless/Desktop/app/profiles:rw
    restart: unless-stopped
    # A pod stop gets 30 s too: requests in flight 3 s, then the browsers close.
    stop_grace_period: 30s
    shm_size: '4gb'
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: '8gb'
        reservations:
          cpus: '1'
          memory: '4gb'

  livellm-controller:
    build:
      context: ./controller
      dockerfile: Dockerfile
    image: kamasalyamov/livellm-browser:controller-2.6.0
    container_name: livellm-controller
    ports:
      # FastAPI Controller
      - "8000:8000"
    environment:
      # The Browser API's whole Node heap: each engine's driver gets half.
      - NODE_OPTIONS=--max-old-space-size=3072
      # File-backed browser registry. In K8s the
      # operator writes this from the namespace's Browser CRs; here it's a
      # static compose config pointing at the browser service.
      - BROWSERS_CONFIG=/etc/livellm/browsers.json
    configs:
      - source: browsers_json
        target: /etc/livellm/browsers.json
    depends_on:
      - livellm-browser
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: '4gb'

  # A Camoufox browser beside it: uncomment, and add its entry to the
  # registry below ("camoufox": {"wsUrl": "ws://livellm-camoufox:9222/playwright/default",
  # "engine": "camoufox"}); the same Browser API drives both.
  # livellm-camoufox:
  #   build:
  #     context: ./browser
  #     dockerfile: camoufox/Dockerfile
  #   image: kamasalyamov/livellm-browser:camoufox-1.0.0
  #   container_name: livellm-camoufox
  #   ports:
  #     - "6902:6901"
  #   volumes:
  #     - camoufox_profiles_volume:/home/headless/Desktop/app/profiles:rw
  #   restart: unless-stopped
  #   shm_size: '2gb'

configs:
  browsers_json:
    content: |
      {"browsers": {"default": "ws://livellm-browser:9222/devtools/browser/default"}}

volumes:
  profiles_volume:
    driver: local
  # camoufox_profiles_volume:
  #   driver: local
