[project]
name = "livellm-browser"
# 2.2.5/2.2.6 were out-of-band builds (garon3455 Docker Hub) of the same driver
# fixes — 2.2.7 is the first repo-built version that carries them.
version = "2.2.7"
description = "Browser in docker with VNC and Chrome, exposing CDP over a launcher API"
readme = "README.md"
requires-python = "==3.9.*"
dependencies = [
    "fastapi>=0.121.3",
    "pydantic>=2.12.4",
    "uvicorn>=0.38.0",
    "patchright==1.56.0",
    "httpx>=0.28.1",
]
# patchright version is actually critical

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
