services:
  livellm-browser:
    build:
      context: ./browser
      dockerfile: Dockerfile
    image: kamasalyamov/livellm-browser:2.0.1
    container_name: livellm-browser-2.0.1
    ports:
      # VNC port
      - "5901:5901"
      # noVNC web interface
      - "6901:6901"
      # FastAPI Launcher
      - "9000:9000"
    environment:
      - VNC_PW=headless
      - VNC_RESOLUTION=1920x1080
      - DISPLAY=:1
    volumes:
      # Mount profiles directory from host with read/write access
      - profiles_volume:/home/headless/Desktop/app/profiles:rw
    restart: unless-stopped
    stop_grace_period: 10s
    shm_size: '4gb'
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: '4gb'
        reservations:
          cpus: '1'
          memory: '2gb'

  livellm-controller:
    build:
      context: ./controller
      dockerfile: Dockerfile
    image: kamasalyamov/livellm-controller:2.0.1
    container_name: livellm-controller-2.0.1
    ports:
      # FastAPI Controller
      - "8000:8000"
    depends_on:
      - livellm-browser
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: '2gb'

  register-browser:
    image: curlimages/curl:latest
    container_name: register-browser
    depends_on:
      - livellm-browser
      - livellm-controller
    restart: "no"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        echo "Waiting for browser service..."
        until curl -sf http://livellm-browser:9000/browsers > /dev/null 2>&1; do
          sleep 2
        done

        echo "Waiting for controller..."
        until curl -sf http://livellm-controller:8000/ping > /dev/null 2>&1; do
          sleep 2
        done

        BROWSER_JSON=$$(curl -sf http://livellm-browser:9000/browsers)
        echo "Discovered browsers: $$BROWSER_JSON"

        BROWSER_ID=$$(echo "$$BROWSER_JSON" | sed -n 's/.*"browser_id" *: *"\([^"]*\)".*/\1/p' | head -1)
        CDP_PORT=$$(echo "$$BROWSER_JSON"   | sed -n 's/.*"cdp_port" *: *\([0-9]*\).*/\1/p'       | head -1)
        WS_EP=$$(echo "$$BROWSER_JSON"      | sed -n 's/.*"ws_endpoint" *: *"\([^"]*\)".*/\1/p'   | head -1)

        WS_URL="ws://livellm-browser:$${CDP_PORT}$${WS_EP}"
        echo "Registering browser_id=$$BROWSER_ID ws_url=$$WS_URL"

        curl -sf -X POST http://livellm-controller:8000/parser/browsers \
          -H "Content-Type: application/json" \
          -d "{\"browser_id\": \"$$BROWSER_ID\", \"ws_url\": \"$$WS_URL\"}"

        echo ""
        echo "Done — browser registered."

volumes:
  profiles_volume:
    driver: local
